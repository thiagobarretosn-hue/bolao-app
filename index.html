<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Bolão Copa do Mundo 2026</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1220">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bolão Copa">
<style>
  html,body{margin:0;height:100%;background:#0b1220;overflow:hidden}
  #app{border:0;width:100%;height:100vh;height:100dvh;display:block}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(800px 400px at 50% 0,#16233a,#0b1220);color:#e8eef7;font-family:Arial,sans-serif;gap:14px}
  #splash img{width:96px;height:96px;border-radius:22px}
  #splash .t{font-size:15px;color:#8aa0bd}
</style>
</head>
<body>
  <div id="splash"><img src="icon-192.png" alt=""><div class="t">Carregando o bolão…</div></div>
  <iframe id="app" allow="clipboard-write"></iframe>
<script>
  // Registro de bolões: apelido (slug) → URL /exec da implantação "Qualquer pessoa".
  // Para um novo bolão (cópia), adicione uma linha aqui: 'apelido': 'https://.../exec'
  var REG = {
    'copa':  { u: 'https://script.google.com/macros/s/AKfycbwxLnytJy0TpQvBOe7OFYKBSOeNA-38l_d2cOJi2Ym5gHwILslgavYpkrk51oi2Dec1/exec', n: 'Bolão Copa do Mundo 2026' },
    'ambar': { u: 'https://script.google.com/macros/s/AKfycbyYRghPF4pO82aRFsRzheTpub5alfpwNaKNEchYmMAOEqxtqRsiirAtyfQab0O14D0P/exec', n: 'Bolão Copa do Mundo 2026 (Ambar)' }
    // novo bolão: 'apelido': { u: 'https://.../exec', n: 'Nome do Bolão' }
  };
  var q = new URLSearchParams(location.search);
  var b = q.get('b');                       // apelido do bolão
  var appParam = q.get('app');              // fallback: URL /exec direta
  var entry = appParam ? { u: appParam, n: '' } : (REG[b] || REG['copa']);
  var BASE = entry.u;
  if (entry.n) { try { document.title = entry.n; } catch (e) {} }
  var slug = appParam ? 'app' : (b && REG[b] ? b : 'copa');
  var KEY = 'bolao_token_' + slug;          // token separado por bolão
  try { // migra a chave antiga do bolão principal
    if (slug === 'copa' && !localStorage.getItem(KEY)) {
      var old = localStorage.getItem('bolao_token'); if (old) localStorage.setItem(KEY, old);
    }
  } catch (e) {}
  var p = q.get('p');
  try { if (p) localStorage.setItem(KEY, p); else p = localStorage.getItem(KEY); } catch (e) {}
  var v = q.get('v');
  var src = BASE + (p ? ('?p=' + encodeURIComponent(p)) : '') + (v ? ((p ? '&' : '?') + 'v=' + encodeURIComponent(v)) : '');
  var ifr = document.getElementById('app');
  ifr.onload = function(){ var s=document.getElementById('splash'); if(s) s.style.display='none'; };
  ifr.src = src;
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
