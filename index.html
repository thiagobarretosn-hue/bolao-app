<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Bolão Copa 2026 — AMBAR</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0b1220">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bolão AMBAR">
<style>
  html,body{margin:0;height:100%;background:#0b1220;overflow:hidden}
  #app{border:0;width:100%;height:100vh;height:100dvh;display:block}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(800px 400px at 50% 0,#16233a,#0b1220);color:#e8eef7;font-family:Arial,sans-serif;gap:14px}
  #splash img{width:96px;height:96px;border-radius:22px}
  #splash .t{font-size:15px;color:#8aa0bd}
</style>
</head>
<body>
  <div id="splash"><img src="icon-192.png" alt=""><div class="t">Carregando o bolão…</div></div>
  <iframe id="app" allow="clipboard-write"></iframe>
<script>
  // Esta fachada é o app da AMBAR. O Bolão Copa migrou para repo próprio
  // (https://thiagobarretosn-hue.github.io/bolao-copa/) — PWA separado, sem choque.
  var q = new URLSearchParams(location.search);
  var b = (q.get('b') || '').toLowerCase();         // apelido (case-insensitive)
  var appParam = q.get('app');                       // modo self-serve: URL /exec direta

  // Links antigos do COPA (?b=copa) → redireciona pro app dedicado, preservando p/v/admin.
  if (!appParam && b === 'copa') {
    var fwd = [];
    ['p','v','admin'].forEach(function(k){ var val=q.get(k); if(val) fwd.push(k+'='+encodeURIComponent(val)); });
    window.location.replace('https://thiagobarretosn-hue.github.io/bolao-copa/' + (fwd.length ? '?' + fwd.join('&') : ''));
  } else {
    var REG = {
      'ambar': { u: 'https://script.google.com/macros/s/AKfycbwuuW1pKmSopbNvnV5qA7gdZK653l9wqJy2b4rsM3W98AOrVGHupmsATDkEz_aanPk-/exec', n: 'Bolão Copa do Mundo 2026 (AMBAR)' }
    };
    var slugParam = (q.get('slug') || '').toLowerCase().replace(/[^a-z0-9_-]/g, '');
    var nParam = q.get('n');                          // nome do bolão (self-serve)
    var regCI = {}; for (var rk in REG) { regCI[rk.toLowerCase()] = REG[rk]; }
    var entry, slug;
    if (appParam) {                                  // ?app=<exec>&slug=apelido&n=Nome
      entry = { u: appParam, n: nParam || '' };
      slug = slugParam || 'app';
    } else if (b && regCI[b]) {                       // ?b=apelido registrado
      entry = regCI[b]; slug = b;
    } else {                                          // padrão = AMBAR
      entry = regCI['ambar']; slug = 'ambar';
    }
    var BASE = entry.u;
    if (entry.n) { try {
      document.title = entry.n;
      var _amt = document.querySelector('meta[name="apple-mobile-web-app-title"]');
      if (_amt) _amt.setAttribute('content', entry.n);
    } catch (e) {} }
    var KEY = 'bolao_token_' + slug;          // token separado por bolão
    var p = q.get('p');
    try { if (p) localStorage.setItem(KEY, p); else p = localStorage.getItem(KEY); } catch (e) {}
    var adm = q.get('admin');
    var AKEY = 'bolao_admin_' + slug;
    try { if (adm) localStorage.setItem(AKEY, adm); else adm = localStorage.getItem(AKEY); } catch (e) {}
    var v = q.get('v');
    var parts = [];
    if (p) parts.push('p=' + encodeURIComponent(p));
    if (v) parts.push('v=' + encodeURIComponent(v));
    if (adm) parts.push('admin=' + encodeURIComponent(adm));
    var src = BASE + (parts.length ? ('?' + parts.join('&')) : '');
    var ifr = document.getElementById('app');
    ifr.onload = function(){ var s=document.getElementById('splash'); if(s) s.style.display='none'; };
    ifr.src = src;
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function(){}); }

    // Logout: limpa só o cofre DESTE bolão (não apaga outros) e volta pra fachada limpa.
    window.addEventListener('message', function(e) {
      if (e.data === 'logout') {
        try {
          localStorage.removeItem('bolao_token_' + slug);
          localStorage.removeItem('bolao_admin_' + slug);
          sessionStorage.clear();
        } catch (err) {}
        var urlOficial = 'https://thiagobarretosn-hue.github.io/bolao-app/';
        if (slug && slug !== 'ambar') urlOficial += '?b=' + slug;
        var cacheBuster = (urlOficial.indexOf('?') > -1 ? '&' : '?') + 'sair=' + Date.now();
        window.location.replace(urlOficial + cacheBuster);
      }
    });
  }
</script>
</body>
</html>
